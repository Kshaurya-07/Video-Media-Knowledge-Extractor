services:
  # ----------------------------------------------------
  # 1. VYORA AI — FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: vyora-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

  # ----------------------------------------------------
  # 2. VYORA AI — React Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: vyora-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vyora-backend
          property: host
